<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${topic != null ? topic.title : 'Topic'}">Topic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<header class="container py-4">
    <h1 class="h3 mb-1">ThesisMatch</h1>
    <p class="text-muted mb-0">Topic details</p>
</header>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <div th:if="${topic == null}" class="alert alert-danger mb-0">
                        Topic not found.
                    </div>

                    <div th:if="${topic != null}">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <div>
                                <h2 class="h4 mb-1" th:text="${topic.title}">Topic title</h2>
                                <p class="text-muted mb-0">
                                    Topic ID: <span th:text="${topic.id}">0</span>
                                </p>
                            </div>
                        </div>

                        <hr>

                        <section class="mb-4" aria-labelledby="descHeading">
                            <h3 id="descHeading" class="h6 mb-2">Description</h3>

                            <div th:if="${topic.description == null or #strings.isEmpty(topic.description)}"
                                 class="text-muted">
                                No description provided.
                            </div>

                            <div th:if="${topic.description != null and !#strings.isEmpty(topic.description)}"
                                 class="border rounded p-3 bg-white">
                                <p class="mb-0" th:text="${topic.description}">Description text</p>
                            </div>
                        </section>

                        <section class="mb-4" aria-labelledby="reqHeading">
                            <h3 id="reqHeading" class="h6 mb-2">Required courses</h3>

                            <ul th:if="${topic.requirements != null and !topic.requirements.isEmpty()}"
                                class="list-group">
                                <li class="list-group-item"
                                    th:each="c : ${topic.requirements}"
                                    th:text="${c}">
                                    Course
                                </li>
                            </ul>

                            <div th:if="${topic.requirements == null or topic.requirements.isEmpty()}"
                                 class="text-muted">
                                No prerequisites.
                            </div>
                        </section>

                        <div class="d-flex gap-2">
                            <a class="btn btn-outline-secondary" th:href="@{/topics}">Return to all topics</a>
                            <a class="btn btn-outline-secondary" th:href="@{/user}">Back</a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<footer class="container py-4">
    <hr>
    <p class="small text-muted mb-0">© HHU – ThesisMatch</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
