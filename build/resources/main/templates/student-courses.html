<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit courses – ThesisMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<header class="container py-4">
    <h1 class="h3 mb-1">ThesisMatch</h1>
    <p class="text-muted mb-0">Edit passed courses</p>
</header>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h2 class="h5 mb-1">
                                Add a passed course for
                                <span th:text="${student.identity.login()}">student</span>
                            </h2>
                            <p class="text-muted mb-0">
                                GitHub ID:
                                <span th:text="${student.identity.githubUserId()}">0</span>
                            </p>
                        </div>

                        <span class="badge text-bg-dark" th:text="${student.role}">STUDENT</span>
                    </div>

                    <hr>

                    <form method="post"
                          th:action="@{/student/{id}/courses(id=${student.identity.githubUserId()})}"
                          novalidate>

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="passedCourse" class="form-label">Course name</label>
                            <input type="text"
                                   class="form-control"
                                   id="passedCourse"
                                   name="passedCourse"
                                   placeholder="Compilerbau"
                                   th:value="${param.passedCourse}"
                                   th:classappend="${coursesError != null} ? ' is-invalid' : ''">

                            <div class="invalid-feedback"
                                 th:if="${coursesError}"
                                 th:text="${coursesError}">
                                Please enter a course.
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-dark">Add</button>
                            <a class="btn btn-outline-secondary"
                               th:href="@{/student/{id}(id=${student.identity.githubUserId()})}">
                                Back
                            </a>
                        </div>
                    </form>

                    <section class="mt-4" aria-labelledby="existingCourses">
                        <h3 id="existingCourses" class="h6 mb-2">Already added</h3>

                        <div th:if="${student.passedCourses != null and !student.passedCourses.isEmpty()}"
                             class="list-group">
                            <div class="list-group-item"
                                 th:each="c : ${student.passedCourses}">
                                <span th:text="${c}">Course</span>
                            </div>
                        </div>

                        <p th:if="${student.passedCourses == null or student.passedCourses.isEmpty()}"
                           class="text-muted mb-0">
                            No passed courses added yet.
                        </p>
                    </section>

                </div>
            </div>
        </div>
    </div>
</main>

<footer class="container py-4">
    <hr>
    <p class="small text-muted mb-0">© HHU – ThesisMatch</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
