<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matches – ThesisMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<header class="container py-4">
    <h1 class="h3 mb-1">ThesisMatch</h1>
    <p class="text-muted mb-0">Matching results</p>
</header>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h2 class="h5 mb-1">Matched topics</h2>
                            <p class="text-muted mb-0">
                                Results for <span class="fw-semibold" th:text="${student.identity.login()}">student</span>
                            </p>
                        </div>
                    </div>

                    <hr>

                    <div th:if="${bestTopics == null or #lists.isEmpty(bestTopics)}"
                         class="alert alert-secondary mb-0"
                         role="status">
                        No matching topics found.
                    </div>

                    <div th:if="${bestTopics != null and !#lists.isEmpty(bestTopics)}" class="table-responsive">
                        <table class="table align-middle">
                            <thead>
                            <tr>
                                <th scope="col">Topic</th>
                                <th scope="col" class="text-end">Link</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="t : ${bestTopics}">
                                <td>
                                    <span class="fw-semibold" th:text="${t.title}">Topic title</span>
                                </td>
                                <td class="text-end">
                                    <a class="btn btn-sm btn-outline-dark"
                                       th:href="@{/topic/{id}(id=${t.id})}">
                                        Open
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="mt-3">
                        <a class="btn btn-outline-secondary"
                           th:href="@{/student/{id}(id=${student.identity.githubUserId()})}">
                            Back to dashboard
                        </a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<footer class="container py-4">
    <hr>
    <p class="small text-muted mb-0">© HHU – ThesisMatch</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
