<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Topics – ThesisMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<header class="container py-4">
    <h1 class="h3 mb-1">ThesisMatch</h1>
    <p class="text-muted mb-0">All topics</p>
</header>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10 col-xl-9">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h2 class="h5 mb-1">Topics</h2>
                            <p class="text-muted mb-0">Browse all available thesis topics.</p>
                        </div>
                    </div>

                    <hr>

                    <div th:if="${topics == null or #lists.isEmpty(topics)}"
                         class="alert alert-secondary mb-0"
                         role="status">
                        No topics available.
                    </div>

                    <div th:if="${topics != null and !#lists.isEmpty(topics)}" class="list-group">
                        <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center"
                           th:each="t : ${topics}"
                           th:href="@{/topic/{id}(id=${t.id})}">
                            <span th:text="${t.title}">Topic title</span>
                            <span class="badge text-bg-light border">Details</span>
                        </a>
                    </div>

                    <div class="mt-3">
                        <a class="btn btn-outline-secondary" th:href="@{/user}">Back</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<footer class="container py-4">
    <hr>
    <p class="small text-muted mb-0">© HHU – ThesisMatch</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
