<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User – ThesisMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<header class="container py-4">
    <h1 class="h3 mb-1">ThesisMatch</h1>
    <p class="text-muted mb-0">Finish setup to continue.</p>
</header>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="h5 mb-3">
                        Hello <span th:text="${username}">user</span>
                    </h2>

                    <p class="text-muted mb-4">
                        Please enter your email and interests, then choose your role.
                    </p>

                    <form method="post" th:action="@{/user}" novalidate>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input id="email"
                                   name="email"
                                   type="email"
                                   class="form-control"
                                   placeholder="name@hhu.de"
                                   required>
                            <div class="form-text">Used for contact and questions.</div>

                            <div class="text-danger small"
                                 th:if="${emailError}"
                                 th:text="${emailError}"></div>
                        </div>

                        <div class="mb-3">
                            <label for="interests" class="form-label">Interests (comma-separated tags)</label>
                            <input id="interests"
                                   name="interests"
                                   type="text"
                                   class="form-control"
                                   placeholder="e.g. Compilers, Rust, Formal Methods">
                            <div class="form-text">At least one interest is required.</div>

                            <div class="text-danger small"
                                 th:if="${interestsError}"
                                 th:text="${interestsError}"></div>
                        </div>

                        <fieldset class="mb-4">
                            <legend class="form-label mb-2">I am…</legend>

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="radio"
                                       name="roleChoice"
                                       id="roleStudent"
                                       value="STUDENT"
                                       required>
                                <label class="form-check-label" for="roleStudent">
                                    Student
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input"
                                       type="radio"
                                       name="roleChoice"
                                       id="roleSupervisor"
                                       value="SUPERVISOR">
                                <label class="form-check-label" for="roleSupervisor">
                                    Supervisor
                                </label>
                                <div class="form-text">
                                    Editing rights require admin approval.
                                </div>
                            </div>

                            <div class="text-danger small"
                                 th:if="${roleError}"
                                 th:text="${roleError}"></div>
                        </fieldset>

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <button class="btn btn-dark w-100" type="submit">
                            Continue
                        </button>

                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<footer class="container py-4">
    <hr>
    <p class="small text-muted mb-0">© HHU – ThesisMatch</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
