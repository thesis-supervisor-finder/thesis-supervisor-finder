<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add topic – ThesisMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<header class="container py-4">
    <h1 class="h3 mb-1">ThesisMatch</h1>
    <p class="text-muted mb-0">Create a new topic</p>
</header>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="h5 mb-3">
                        New topic for <span th:text="${supervisor.identity.login()}">supervisor</span>
                    </h2>

                    <form method="post"
                          th:action="@{/supervisor/{id}/topic(id=${supervisor.identity.githubUserId()})}"
                          novalidate>

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="title" class="form-label">Title</label>
                            <input id="title"
                                   name="title"
                                   type="text"
                                   class="form-control"
                                   placeholder="My awesome thesis topic"
                                   th:classappend="${titleError != null} ? ' is-invalid' : ''"
                                   th:value="${param.title}">
                            <div class="invalid-feedback" th:if="${titleError}" th:text="${titleError}">
                                Should have a title
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea id="description"
                                      name="description"
                                      rows="5"
                                      class="form-control"
                                      placeholder="Describe the topic..."
                                      th:classappend="${descriptionError != null} ? ' is-invalid' : ''"
                                      th:text="${param.description}"></textarea>
                            <div class="invalid-feedback" th:if="${descriptionError}" th:text="${descriptionError}">
                                Please enter a description
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="requirements" class="form-label">Requirements (comma-separated courses)</label>
                            <input id="requirements"
                                   name="requirements"
                                   type="text"
                                   class="form-control"
                                   placeholder="Compilerbau, Datenbanken, Software Engineering"
                                   th:classappend="${requirementsError != null} ? ' is-invalid' : ''"
                                   th:value="${param.requirements}">
                            <div class="form-text">Example: Compilerbau, Datenbanken</div>
                            <div class="invalid-feedback" th:if="${requirementsError}" th:text="${requirementsError}">
                                Please enter at least one requirement
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-dark">Create</button>
                            <a class="btn btn-outline-secondary"
                               th:href="@{/supervisor/{id}(id=${supervisor.identity.githubUserId()})}">
                                Back
                            </a>
                        </div>

                    </form>

                </div>
            </div>
        </div>
    </div>
</main>

<footer class="container py-4">
    <hr>
    <p class="small text-muted mb-0">© HHU – ThesisMatch</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
