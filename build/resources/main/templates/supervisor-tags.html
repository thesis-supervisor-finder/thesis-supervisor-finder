<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supervisor Tags – ThesisMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<header class="container py-4">
    <h1 class="h3 mb-1">ThesisMatch</h1>
    <p class="text-muted mb-0">Edit supervisor tags</p>
</header>

<main class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-8 col-xl-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">

                    <h2 class="h5 mb-3">
                        Edit tags for <span th:text="${supervisor.identity.login()}">supervisor</span>
                    </h2>

                    <form method="post"
                          th:action="@{/supervisor/{id}/tags(id=${supervisor.identity.githubUserId()})}"
                          novalidate>

                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                        <div class="mb-3">
                            <label for="newInterests" class="form-label">Tags (comma-separated)</label>
                            <input id="newInterests"
                                   name="newInterests"
                                   type="text"
                                   class="form-control"
                                   placeholder="AI, Security, HCI"
                                   th:value="${interests}"
                                   th:classappend="${interestsError != null} ? ' is-invalid' : ''">

                            <div class="invalid-feedback" th:if="${interestsError}" th:text="${interestsError}">
                                Please enter at least one tag.
                            </div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-dark">Save</button>
                            <a class="btn btn-outline-secondary"
                               th:href="@{/supervisor/{id}(id=${supervisor.identity.githubUserId()})}">
                                Back
                            </a>
                        </div>

                    </form>

                    <hr class="my-4">

                    <h3 class="h6 mb-2">Current tags</h3>

                    <div th:if="${supervisor.interests != null and !supervisor.interests.isEmpty()}"
                         class="d-flex flex-wrap gap-2">
            <span class="badge text-bg-secondary"
                  th:each="tag : ${supervisor.interests}"
                  th:text="${tag}">
              Tag
            </span>
                    </div>

                    <div th:if="${supervisor.interests == null or supervisor.interests.isEmpty()}"
                         class="text-muted">
                        No tags yet.
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<footer class="container py-4">
    <hr>
    <p class="small text-muted mb-0">© HHU – ThesisMatch</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
